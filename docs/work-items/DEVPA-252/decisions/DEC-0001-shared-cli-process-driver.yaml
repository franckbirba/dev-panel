work_item_id: "da5664c0-e7ab-4814-b4fa-b13b83e9981c"
status: accepted
context: >
  Le chantier A exige un contrat ExecutionAdapter commun pour Claude Code et Kimi Code,
  avec des preuves comparables et aucun appel direct aux API modèles. Une implémentation
  séparée du cycle de vie JSONL pour chaque CLI aurait dupliqué spawn, buffers, reprise,
  annulation et journalisation des artefacts.
options:
  - id: duplicated-drivers
    description: Conserver un runner complet et indépendant pour chaque CLI.
  - id: shared-cli-process-driver
    description: Mutualiser le cycle de vie dans CliProcessDriver et ne laisser aux drivers que les commandes et mappings natifs.
chosen_option: shared-cli-process-driver
rationale: >
  Le runner mutualisé évite la duplication et surtout la divergence des règles critiques :
  annulation seulement après arrêt effectif, reprise par session native, séquence des
  événements et artefacts SHA-256. Les tests prouvent le même comportement sur les deux
  adaptateurs sans appel fournisseur.
consequences:
  - Les nouveaux drivers héritent du même cycle de vie et des mêmes preuves.
  - Toute divergence native reste confinée à buildInvocation et handleNativeEvent.
  - Les libellés produits restent distincts des identifiants techniques de contrat.
  - L’attestation réelle de Claude reste bloquée tant que sa session OAuth est expirée ; les tests mockés ne valent pas attestation de version.
