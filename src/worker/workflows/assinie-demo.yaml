name: assinie-demo
description: Démo Assinie workflow with full-stack, ops and cybersecurity checks
max_revisions: 3
on_exhaustion: block

steps:
  # Start with the builder to implement the feature
  - agent: builder
    on:
      done:     { next: cybersecurity }
      blocked:  { next: pm, workflow: replan }
      failed:   { terminal: true }

  # Security audit step
  - agent: cybersecurity
    retreat_allowed: [builder]
    on:
      done:     { next: ops }
      failed:   { next: builder, when: security_issues_found }
      blocked:  { next: pm, workflow: replan }

  # Operations verification step
  - agent: ops
    retreat_allowed: [cybersecurity]
    on:
      done:     { next: full-stack }
      failed:   { next: cybersecurity, when: ops_issues_found }
      blocked:  { next: pm, workflow: replan }

  # Full-stack implementation step
  - agent: full-stack
    retreat_allowed: [ops]
    on:
      done:     { next: reviewer }
      failed:   { next: ops, when: implementation_issues_found }
      blocked:  { next: pm, workflow: replan }

  # Final review
  - agent: reviewer
    retreat_allowed: [full-stack]
    on:
      done:     { next: qa }
      failed:   { next: full-stack, when: reviewer_rejected_pr }
      blocked:  { next: pm, workflow: replan }

  # Quality assurance
  - agent: qa
    retreat_allowed: [pm]
    on:
      done:     { terminal: true }
      failed:   { next: pm, workflow: replan }
      blocked:  { next: pm, workflow: replan }