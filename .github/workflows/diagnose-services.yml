name: Diagnose Services Host

# Diagnostic lecture seule du nœud services (celui qui porte devpanl.dev,
# Postgres agent_memory et Redis BullMQ) via SSH depuis un runner cloud —
# même mécanique que deploy.yml. Créé le 2026-08-11 : le LAN privé
# 10.0.0.x est suspect (ETIMEDOUT depuis l'hôte agents vers 10.0.0.2:5432
# et :6379) et les verbes runtime du MCP tombent en transport dropped.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "== vitals =="
            uptime; free -h | head -2; df -h / | tail -1
            echo "== interfaces (LAN 10.0.0.x attendu) =="
            ip -brief addr
            echo "== routes =="
            ip route | head -10
            echo "== écoute 5432 / 6379 =="
            (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null) | grep -E ':5432|:6379' || echo "AUCUNE ECOUTE 5432/6379"
            echo "== conteneurs =="
            docker ps --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' | head -30
            echo "== ping hôte agents via LAN (10.0.0.1 et 10.0.0.3) =="
            ping -c 2 -W 2 10.0.0.1 >/dev/null 2>&1 && echo "10.0.0.1: OK" || echo "10.0.0.1: FAIL"
            ping -c 2 -W 2 10.0.0.3 >/dev/null 2>&1 && echo "10.0.0.3: OK" || echo "10.0.0.3: FAIL"
            echo "== voisins ARP LAN =="
            ip neigh | grep '10\.0\.0\.' || echo "aucun voisin 10.0.0.x"
