name: Activate OpenCode for Agents

on:
  workflow_dispatch:

jobs:
  activate:
    runs-on: [self-hosted, hetzner-agents]
    timeout-minutes: 8
    steps:
      - name: Install OpenCode 2.1.4 for the deploy user
        run: |
          if ! sudo -u deploy test -x /home/deploy/.opencode/bin/opencode; then
            sudo -u deploy bash -c 'curl -fsSL https://opencode.ai/install | bash -s -- --version 2.1.4 --no-modify-path'
          fi
          sudo -u deploy mkdir -p /home/deploy/.local/bin
          sudo -u deploy ln -sf /home/deploy/.opencode/bin/opencode /home/deploy/.local/bin/opencode

      - name: Check OpenCode version
        run: |
          /home/deploy/.local/bin/opencode --version
          /home/deploy/.local/bin/opencode run --help

      - name: Smoke test OpenCode before changing the worker
        run: |
          cd /home/deploy/projects/dev-panel
          sudo -u deploy /home/deploy/.local/bin/opencode run --format json "Reply with exactly OK. Do not use tools."

      - name: Activate the OpenCode driver
        run: |
          if sudo -n test -f /home/deploy/.fleet-paused; then
            echo "fleet-paused — refusing to restart the worker"
            exit 1
          fi
          printf '%s\n' \
            '# Managed by opencode-activate.yml' \
            'DRIVER_DEFAULT=opencode-cli' \
            | sudo -n tee /home/deploy/.driver-default > /dev/null
          sudo -n chown deploy:deploy /home/deploy/.driver-default
          sudo -n chmod 644 /home/deploy/.driver-default
          sudo -n systemctl restart devpanel-worker.service
          sleep 8
          systemctl is-active devpanel-worker.service
          cat /home/deploy/.driver-default
