name: Diagnose Agents Host

# Diagnostic lecture seule de l'hôte agents (hetzner-vps) via son runner
# self-hosted. Créé le 2026-08-11 pendant l'activation de la boucle autonome :
# les verbes MCP runtime (tail_log, run_remote, host_status) vers hetzner-vps
# tombaient en "transport dropped" et le smoke deploy montrait des ETIMEDOUT
# vers 10.0.0.2 — ce workflow est le chemin de secours pour voir l'état réel.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, hetzner-agents]
    timeout-minutes: 5
    steps:
      - name: Worker service status
        run: |
          systemctl is-active devpanel-worker.service || true
          systemctl status devpanel-worker.service --no-pager -l | head -20 || true

      - name: Worker journal (last 150 lines)
        run: journalctl -u devpanel-worker.service --no-pager -n 150 || true

      - name: LAN connectivity to services node (10.0.0.2)
        run: |
          timeout 5 bash -c '</dev/tcp/10.0.0.2/5432' && echo "PG 5432: OK" || echo "PG 5432: FAIL"
          timeout 5 bash -c '</dev/tcp/10.0.0.2/6379' && echo "REDIS 6379: OK" || echo "REDIS 6379: FAIL"

      - name: LAN interface & route state
        run: |
          ip -brief addr
          ip route | head -10
          ping -c 2 -W 2 10.0.0.2 >/dev/null 2>&1 && echo "ping 10.0.0.2: OK" || echo "ping 10.0.0.2: FAIL"
          ip neigh | grep '10\.0\.0\.' || echo "aucun voisin 10.0.0.x"

      - name: Shelly / telegram units
        run: |
          systemctl list-units 'shelly*' 'telegram*' --no-pager --all || true

      - name: Repo clones on agents host
        run: |
          for d in /home/deploy/projects/*/; do
            echo "$d -> $(git -C "$d" remote get-url origin 2>/dev/null || echo 'pas un repo git')"
          done

      - name: Host vitals
        run: |
          uptime
          free -h
          df -h / | tail -1
