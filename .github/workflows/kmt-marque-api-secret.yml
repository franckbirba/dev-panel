# Pousse la clé DeepInfra (déjà dans les secrets de ce dépôt) dans les secrets
# Cloudflare Pages de l'API de marque KMT (projet `marque-api`, api.openkmt.org).
# Même mécanisme que kmt-site-secrets.yml : la clé ne s'affiche jamais.
# Prérequis : secret repo KMT_CLOUDFLARE_API_TOKEN (token Pages du compte KMT).
name: KMT API de marque — secret DeepInfra
on:
  workflow_dispatch:
  push:
    branches: [claude/marque-api-secret]
    paths: [.github/workflows/kmt-marque-api-secret.yml]
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.KMT_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 59ca249f7f4a9111c93523ab27d52a1f
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: DEEPINFRA_API_KEY (production)
        run: printf %s "$V" | npx -y wrangler@4 pages secret put DEEPINFRA_API_KEY --project-name marque-api --env production
        env: { V: "${{ secrets.DEEPINFRA_API_KEY }}" }
