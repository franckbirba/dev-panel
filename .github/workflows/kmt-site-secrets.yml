# Pousse le token Telegram (déjà dans les secrets du repo) dans les secrets
# Cloudflare Pages du site openkmt.org (projet `kemet`). Utilisé par la
# fonctions /api/contribute et /api/chat (accueil IA via DeepInfra).
# Prérequis : secret repo KMT_CLOUDFLARE_API_TOKEN (token Pages du site KMT).
name: KMT site — secrets Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [claude/kemet-cloudflare-site-1e79f3]
    paths: [.github/workflows/kmt-site-secrets.yml]
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.KMT_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 59ca249f7f4a9111c93523ab27d52a1f
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: TG_TOKEN (production)
        run: printf %s "$V" | npx -y wrangler@4 pages secret put TG_TOKEN --project-name kemet --env production
        env: { V: "${{ secrets.TELEGRAM_BOT_TOKEN }}" }
      - name: TG_CHAT (production)
        run: printf %s "$V" | npx -y wrangler@4 pages secret put TG_CHAT --project-name kemet --env production
        env: { V: "${{ secrets.TELEGRAM_CHAT_ID }}" }
      - name: DEEPINFRA_API_KEY (production)
        run: printf %s "$V" | npx -y wrangler@4 pages secret put DEEPINFRA_API_KEY --project-name kemet --env production
        env: { V: "${{ secrets.DEEPINFRA_API_KEY }}" }
      - name: TG_TOKEN (preview)
        run: printf %s "$V" | npx -y wrangler@4 pages secret put TG_TOKEN --project-name kemet --env preview
        env: { V: "${{ secrets.TELEGRAM_BOT_TOKEN }}" }
      - name: TG_CHAT (preview)
        run: printf %s "$V" | npx -y wrangler@4 pages secret put TG_CHAT --project-name kemet --env preview
        env: { V: "${{ secrets.TELEGRAM_CHAT_ID }}" }
      - name: DEEPINFRA_API_KEY (preview)
        run: printf %s "$V" | npx -y wrangler@4 pages secret put DEEPINFRA_API_KEY --project-name kemet --env preview
        env: { V: "${{ secrets.DEEPINFRA_API_KEY }}" }
