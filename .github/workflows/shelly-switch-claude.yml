name: Shelly Switch to Claude

# 2026-08-11 — Franck est spammé de demandes allow/deny dans Telegram :
# shelly-pi (fallback Qwen3, actif depuis la bascule quota) gère mal le
# protocole d'outils et déclenche le relais de permissions du canal.
# Remède = le switch officiel : scripts/shelly-switch.sh claude
# (stoppe shelly-pi, démasque+démarre shelly.service, DRIVER_DEFAULT=claude,
# bounce worker). Réversible à tout moment avec `pi`.

on:
  workflow_dispatch:

jobs:
  switch:
    runs-on: [self-hosted, hetzner-agents]
    timeout-minutes: 6
    steps:
      - name: Switch Shelly + builders to claude (unmask robuste)
        run: |
          cd /home/deploy/projects/dev-panel
          sudo -n bash scripts/shelly-switch.sh status || true
          echo "== etat des masks =="
          ls -la /etc/systemd/system/shelly.service /run/systemd/system/shelly.service 2>/dev/null || true
          echo "== unmask natif (gere etc + runtime) =="
          sudo -n systemctl unmask shelly.service || true
          if [ ! -e /etc/systemd/system/shelly.service ] && [ ! -e /lib/systemd/system/shelly.service ]; then
            echo "unit absente apres unmask — installation depuis infra/"
            sudo -n cp infra/shelly.service /etc/systemd/system/shelly.service
          fi
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable shelly.service 2>/dev/null || true
          sudo -n systemctl start shelly.service
          sudo -n systemctl restart devpanel-worker.service
          sudo -n bash scripts/shelly-switch.sh status || true

      - name: Post-check units
        run: |
          systemctl is-active shelly.service || true
          systemctl is-active shelly-pi.service || echo "shelly-pi arrêté (attendu)"
          systemctl is-active devpanel-worker.service
