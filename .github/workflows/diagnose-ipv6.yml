name: Diagnose IPv6 Origin Path

# 2026-08-11 : 522 Cloudflare sélectifs (Franck) alors que l'origin répond en
# v4 partout. Hypothèse : AAAA origin + routing IPv6 serveur cassé → les
# colos Cloudflare qui tentent le v6 échouent. Diagnostic LECTURE SEULE.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "== adresses v6 =="
            ip -6 -brief addr | grep -v "fe80" | head -5
            echo "== route v6 par défaut =="
            ip -6 route | grep default || echo "PAS DE ROUTE V6 PAR DEFAUT"
            echo "== egress v6 (ping cloudflare) =="
            ping -6 -c 2 -W 3 2606:4700:4700::1111 >/dev/null 2>&1 && echo "ping6 egress: OK" || echo "ping6 egress: FAIL"
            echo "== ecoute 443 v6 =="
            ss -6 -tln | grep ':443' || echo "aucune ecoute v6 :443"
            echo "== self-test 443 via v6 locale =="
            V6=$(ip -6 -brief addr | grep -v fe80 | awk '{print $3}' | cut -d/ -f1 | head -1)
            echo "adresse testee: $V6"
            if [ -n "$V6" ]; then
              curl -s -o /dev/null -w "curl -6 self :443 -> %{http_code}\n" -k -m 8 -H "Host: devpanl.dev" "https://[$V6]/api/health" || echo "curl v6 self: FAIL"
            else
              echo "pas d'adresse v6 globale"
            fi
